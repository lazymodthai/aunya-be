name: Build, Push, and Deploy to Docker Hub
on:
  push:
    branches:
      - prod
env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_IMAGE_NAME: aunya-be
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Step 5: Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/aunya-be:latest

      # Step 6: Deploy to Server via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "NIPA_CLOUD_ENDPOINT=${{ secrets.NIPA_CLOUD_ENDPOINT }}" > .env
            echo "NIPA_CLOUD_BUCKET_NAME=${{ secrets.NIPA_CLOUD_BUCKET_NAME }}" >> .env
            echo "NIPA_CLOUD_ACCESS_KEY_ID=${{ secrets.NIPA_CLOUD_ACCESS_KEY_ID }}" >> .env
            echo "NIPA_CLOUD_SECRET_ACCESS_KEY=${{ secrets.NIPA_CLOUD_SECRET_ACCESS_KEY }}" >> .env
            echo "DB_TYPE=${{ secrets.DB_TYPE }}" >> .env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "BOT_API_TOKEN=${{ secrets.BOT_API_TOKEN }}" >> .env
            echo "BOT_API_URL=${{ secrets.BOT_API_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            docker compose pull
            docker compose up -
            docker image prune -af --filter "until=72h"

      # Step 7: Clean up (optional but good practice)
      - name: Clean up
        if: always()
        run: rm -rf ~/.docker
