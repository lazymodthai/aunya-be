version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_PASSWORD: credit1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  app:
    image: lazymodthai/aunya-be:latest
    env_file:
      - ./.env
    ports:
      - "3005:3000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: